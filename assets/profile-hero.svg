    <ellipse cx="998" cy="285" rx="420" ry="360" fill="url(#ambient)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="64" y="66" fill="#F5F5F7" font-size="23" font-weight="650" letter-spacing="4">PAWEŁ</text>
      <text x="1136" y="64" text-anchor="end" fill="#A6A8BA" font-size="18" letter-spacing="1">8+ YEARS OF BUILDING</text>
      <path d="M64 97H1136" stroke="#FFFFFF" stroke-opacity=".1"/>
      <circle cx="1004" cy="282" r="133" fill="#7772FF" opacity=".17" filter="url(#glow)"/>
      <circle cx="1004" cy="277" r="126" fill="url(#orb)" stroke="url(#rim)" stroke-width="1.5"/>
      <ellipse cx="982" cy="229" rx="79" ry="37" transform="rotate(-32 982 229)" stroke="#E8EDFF" stroke-opacity=".15"/>
      <ellipse cx="1004" cy="277" rx="126" ry="56" transform="rotate(-32 1004 277)" stroke="#D1D7FF" stroke-opacity=".18"/>
      <ellipse cx="1025" cy="319" rx="79" ry="37" transform="rotate(-32 1025 319)" stroke="#C7ACFF" stroke-opacity=".14"/>
      <text x="64" y="218" fill="#F5F5F7" font-size="101" font-weight="700" letter-spacing="-5">From idea.</text>
      <text x="64" y="328" fill="url(#headline)" font-size="101" font-weight="700" letter-spacing="-5">To intelligence.</text>
      <text x="68" y="387" fill="#AAACBC" font-size="27" letter-spacing="-.4">Fullstack Developer &amp; AI/ML Engineer</text>
      <path d="M64 449H1136" stroke="#FFFFFF" stroke-opacity=".1"/>
      <text x="66" y="493" fill="#9295A9" font-size="16" letter-spacing="3">THE CORE STACK</text>
      <g transform="translate(64 522)">
        <rect width="344" height="144" rx="20" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".09"/>
        <circle cx="38" cy="37" r="5" fill="#79D8F5"/>
        <text x="28" y="86" fill="#F5F5F7" font-size="37" font-weight="600" letter-spacing="-1">React</text>
        <text x="28" y="117" fill="#A1A5B6" font-size="19">Interfaces that feel right.</text>
      </g>
      <g transform="translate(428 522)">
        <rect width="344" height="144" rx="20" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".09"/>
        <circle cx="38" cy="37" r="5" fill="#B5A2FF"/>
        <text x="28" y="86" fill="#F5F5F7" font-size="37" font-weight="600" letter-spacing="-1">Python</text>
        <text x="28" y="117" fill="#A1A5B6" font-size="19">Backends. AI. Machine learning.</text>
      </g>
      <g transform="translate(792 522)">
        <rect width="344" height="144" rx="20" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".09"/>
        <circle cx="38" cy="37" r="5" fill="#82AEFF"/>
        <text x="28" y="86" fill="#F5F5F7" font-size="37" font-weight="600" letter-spacing="-1">TypeScript</text>
        <text x="28" y="117" fill="#A1A5B6" font-size="19">Clarity across the stack.</text>
      </g>
